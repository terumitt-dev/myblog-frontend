name: AI Approve Bridge

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: read
  contents: read

jobs:
  approve:
    # Claude または Codex の「問題なし」コメントをトリガーに両方を確認して Approve する
    if: |
      github.event.issue.pull_request != null &&
      (
        (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
         contains(github.event.comment.body, 'Didn''t find any major issues')) ||
        (github.event.comment.user.login == 'claude[bot]' &&
         contains(github.event.comment.body, '重大な問題は見当たりませんでした'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check both AIs said no issues after latest commit
        id: check
        run: |
          PR_NUM="${{ github.event.issue.number }}"
          REPO="${{ github.repository }}"

          # 最新コミットの時刻を取得
          HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUM" --jq .head.sha)
          COMMIT_DATE=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq .commit.committer.date)

          # Claude: 最新コミット以降の「問題なし」コメントのみ対象
          # --paginate は直接 jq にパイプして全ページをマージした単一配列として処理する
          CLAUDE_OK=$(gh api "repos/$REPO/issues/$PR_NUM/comments" \
            --method GET -F per_page=100 --paginate \
            | jq --arg since "$COMMIT_DATE" \
            '[.[] | select(
              .user.login == "claude[bot]" and
              .created_at >= $since and
              (.body | (
                contains("重大な問題は見当たりませんでした") or
                contains("重大な問題は見つかりませんでした")
              ))
            )] | length')

          # Codex: 最新コミット以降の「Didn't find any major issues」コメントのみ対象
          CODEX_OK=$(gh api "repos/$REPO/issues/$PR_NUM/comments" \
            --method GET -F per_page=100 --paginate \
            | jq --arg since "$COMMIT_DATE" \
            '[.[] | select(
              .user.login == "chatgpt-codex-connector[bot]" and
              .created_at >= $since and
              (.body | contains("Didn'\''t find any major issues"))
            )] | length')

          echo "head_sha=$HEAD_SHA"
          echo "commit_date=$COMMIT_DATE"
          echo "claude_ok=$CLAUDE_OK"
          echo "codex_ok=$CODEX_OK"

          if [ "$CLAUDE_OK" -gt 0 ] && [ "$CODEX_OK" -gt 0 ]; then
            echo "both_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "both_ok=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve PR
        if: steps.check.outputs.both_ok == 'true'
        run: |
          gh pr review "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --approve \
            --body "Claude + Codex レビュー完了：両 AI が問題なしと判定。承認します。"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
