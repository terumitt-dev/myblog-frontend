# =========================
# CI Pipeline (build & verify)
# =========================
kind: pipeline
type: docker
name: ci

trigger:
  branch: [main, develop]
  event: [push]

steps:
  - name: build-and-verify
    image: docker:24-dind
    privileged: true
    commands:
      - set -euo pipefail
      - echo "🐳 Starting Docker daemon..."
      - dockerd-entrypoint.sh &
      - |
        for i in $(seq 1 60); do
          if docker info >/dev/null 2>&1; then break; fi
          echo "Waiting for Docker..."
          sleep 1
          if [ "$i" -eq 60 ]; then echo "❌ Docker daemon failed to start"; exit 1; fi
        done

      - echo "🔨 Building Docker image..."
      - docker build -f app/Dockerfile.prod --build-arg VITE_API_BASE_URL=/api -t go-lilaregard-frontend:ci app/
      - echo "✅ Build succeeded"

      - echo ""
      - echo "📏 Image size check..."
      - docker images go-lilaregard-frontend:ci --format "   Size:{{.Size}}"
      - echo ""

      - echo "🏥 Container startup check..."
      - |
        docker run -d --name frontend-ci \
          -p 8080:80 \
          go-lilaregard-frontend:ci

        echo "   Waiting for container to start..."
        sleep 5

        echo "   Container status:"
        docker ps --filter name=frontend-ci --format "   {{.Status}}"

        if ! docker ps --filter name=frontend-ci --format "{{.Status}}" | grep -q "Up"; then
          echo "❌ Container failed to start"
          echo "   Container logs:"
          docker logs frontend-ci 2>&1 | tail -20
          exit 1
        fi
        echo "✅ Container is running"

      - echo ""
      - echo "🌐 Health check..."
      - |
        HTTP_STATUS=$(wget -qO- -S http://localhost:8080/ 2>&1 | head -1)
        if wget -qO- http://localhost:8080/ | grep -q "<!DOCTYPE html>"; then
          echo "✅ Health check passed (index.html served correctly)"
        else
          echo "❌ Health check failed (index.html not served)"
          docker logs frontend-ci 2>&1 | tail -20
          docker stop frontend-ci && docker rm frontend-ci
          exit 1
        fi

      - echo ""
      - echo "🔒 API fallback check..."
      - |
        API_STATUS=$(wget -qS http://localhost:8080/api/ 2>&1 | grep "HTTP/" | awk '{print $2}' || echo "000")
        if echo "$API_STATUS" | grep -q "404"; then
          echo "✅ /api/ correctly returns 404 (SPA fallback excluded)"
        else
          echo "⚠️ /api/ returned unexpected status: $API_STATUS"
        fi

      - echo ""
      - echo "🧹 Cleanup..."
      - docker stop frontend-ci && docker rm frontend-ci
      - echo ""
      - echo "✅ All CI checks passed"

---
# =========================
# CD Pipeline (ECR push)
# =========================
kind: pipeline
type: docker
name: cd

trigger:
  branch: [main]
  event: [push]

depends_on:
  - ci

steps:
  - name: check-vars
    image: alpine
    environment:
      AWS_REGION:
        from_secret: AWS_REGION
      AWS_ACCESS_KEY_ID:
        from_secret: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: AWS_SECRET_ACCESS_KEY
      ECR_REGISTRY:
        from_secret: ECR_REGISTRY
    commands:
      - set -euo pipefail
      - '[ -n "$AWS_REGION" ] || (echo "❌ AWS_REGION is not set" && exit 1)'
      - '[ -n "$AWS_ACCESS_KEY_ID" ] || (echo "❌ AWS_ACCESS_KEY_ID is not set" && exit 1)'
      - '[ -n "$AWS_SECRET_ACCESS_KEY" ] || (echo "❌ AWS_SECRET_ACCESS_KEY is not set" && exit 1)'
      - '[ -n "$ECR_REGISTRY" ] || (echo "❌ ECR_REGISTRY is not set" && exit 1)'
      - echo "✅ All required variables are set"

  - name: build-and-push
    image: docker:24-dind
    privileged: true
    environment:
      AWS_REGION:
        from_secret: AWS_REGION
      AWS_ACCESS_KEY_ID:
        from_secret: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: AWS_SECRET_ACCESS_KEY
      ECR_REGISTRY:
        from_secret: ECR_REGISTRY
    commands:
      - set -euo pipefail
      - echo "🐳 Starting Docker daemon..."
      - dockerd-entrypoint.sh &
      - |
        for i in $(seq 1 60); do
          if docker info >/dev/null 2>&1; then break; fi
          echo "Waiting for Docker..."
          sleep 1
          if [ "$i" -eq 60 ]; then echo "❌ Docker daemon failed to start"; exit 1; fi
        done

      - echo "🔐 Logging in to ECR..."
      - apk add --no-cache aws-cli
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

      - echo "🔨 Building Docker image..."
      - docker build -f app/Dockerfile.prod --build-arg VITE_API_BASE_URL=/api -t $ECR_REGISTRY/go-lilaregard-frontend:${DRONE_COMMIT_SHA} -t $ECR_REGISTRY/go-lilaregard-frontend:latest app/

      - echo "🚀 Pushing to ECR..."
      - docker push $ECR_REGISTRY/go-lilaregard-frontend:${DRONE_COMMIT_SHA}
      - docker push $ECR_REGISTRY/go-lilaregard-frontend:latest

      - echo "✅ Image pushed successfully"
      - echo "   → $ECR_REGISTRY/go-lilaregard-frontend:${DRONE_COMMIT_SHA}"
