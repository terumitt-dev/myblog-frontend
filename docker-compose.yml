version: '3.8'

services:
  frontend:
    build: ./app
    ports:
      - "5173:5173"
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - BW_CLIENT_ID=${BW_CLIENT_ID:-}
      - BW_CLIENT_SECRET=${BW_CLIENT_SECRET:-}
      - BW_PASSWORD=${BW_PASSWORD:-}
    command: ["npm", "run", "dev:mock", "--", "--host"]
