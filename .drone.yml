# =========================
# CI/CD Pipeline
# =========================
kind: pipeline
type: kubernetes
name: ci-cd

trigger:
  event: [push, pull_request]
  branch: [main, develop]

node_selector:
  node-role: drone
tolerations:
  - key: dedicated
    value: drone
    effect: NoSchedule

steps:
  # シークレットを参照するステップは、実際に使う main への push のときだけ動かす。
  - name: check-vars
    image: alpine
    when:
      branch: [main]
      event: [push]
    environment:
      AWS_REGION:
        from_secret: AWS_REGION
      AWS_ACCESS_KEY_ID:
        from_secret: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: AWS_SECRET_ACCESS_KEY
      ECR_REGISTRY:
        from_secret: ECR_REGISTRY
      VITE_TURNSTILE_SITE_KEY:
        from_secret: VITE_TURNSTILE_SITE_KEY
    commands:
      - set -euxo pipefail
      - '[ -n "$AWS_REGION" ]'
      - '[ -n "$AWS_ACCESS_KEY_ID" ]'
      - '[ -n "$AWS_SECRET_ACCESS_KEY" ]'
      - '[ -n "$ECR_REGISTRY" ]'
      - '[ -n "$VITE_TURNSTILE_SITE_KEY" ]'

  - name: setup-ecr-auth
    image: amazon/aws-cli:latest
    when:
      branch: [main]
      event: [push]
    environment:
      AWS_REGION:
        from_secret: AWS_REGION
      AWS_ACCESS_KEY_ID:
        from_secret: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: AWS_SECRET_ACCESS_KEY
      ECR_REGISTRY:
        from_secret: ECR_REGISTRY
    commands:
      - mkdir -p /drone/src/.docker
      - |
        ECR_TOKEN=$(aws ecr get-login-password --region "$AWS_REGION")
        AUTH=$(printf 'AWS:%s' "$ECR_TOKEN" | base64 -w 0)
        printf '{"auths":{"%s":{"auth":"%s"}}}' "$ECR_REGISTRY" "$AUTH" > /drone/src/.docker/config.json
      - echo "ECR auth config written"

  - name: build
    image: gcr.io/kaniko-project/executor:debug
    environment:
      ECR_REGISTRY:
        from_secret: ECR_REGISTRY
      VITE_TURNSTILE_SITE_KEY:
        from_secret: VITE_TURNSTILE_SITE_KEY
      DOCKER_CONFIG: /drone/src/.docker
    commands:
      - |
        if [ "$DRONE_BRANCH" = "main" ] && [ "$DRONE_BUILD_EVENT" = "push" ]; then
          /kaniko/executor \
            --context=dir:///drone/src/app \
            --dockerfile=/drone/src/app/Dockerfile.prod \
            --build-arg VITE_API_BASE_URL=/api \
            --build-arg "VITE_TURNSTILE_SITE_KEY=$VITE_TURNSTILE_SITE_KEY" \
            --destination="$ECR_REGISTRY/go-lilaregard-frontend:$DRONE_COMMIT_SHA" \
            --destination="$ECR_REGISTRY/go-lilaregard-frontend:latest"
        else
          # push しない確認用ビルド。Site Key が渡らない場合 (pull_request など) は
          # Cloudflare 公開のテスト用 Site Key (always pass) でビルドだけ通す。
          # https://developers.cloudflare.com/turnstile/troubleshooting/testing/
          /kaniko/executor \
            --context=dir:///drone/src/app \
            --dockerfile=/drone/src/app/Dockerfile.prod \
            --build-arg VITE_API_BASE_URL=/api \
            --build-arg "VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}" \
            --no-push
        fi
